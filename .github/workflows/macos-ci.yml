name: macOS CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS app
        run: >-
          xcodebuild
          -project TeleDeckMac.xcodeproj
          -scheme TeleDeckMac
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run macOS tests
        run: >-
          xcodebuild
          -project TeleDeckMac.xcodeproj
          -scheme TeleDeckMac
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test
